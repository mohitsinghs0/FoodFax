<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EA580C" />
    <title>FoodFax - Order Fresh Street Food & Meals in Vasai-Virar</title>
    <meta name="description" content="Order fresh street food, live queue tokens, and meals from local food stalls, tapris, and food trucks in Vasai-Virar. Pay seamlessly with UPI and track kitchen orders live." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foodfax.in" />
    <meta property="og:title" content="FoodFax - Order Fresh Street Food & Meals in Vasai-Virar" />
    <meta property="og:description" content="Discover local street food stalls, tapris, and canteens in Vasai-Virar. Order live tokens, skip waiting queues, and pay seamlessly with UPI." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://foodfax.in" />
    <meta name="twitter:title" content="FoodFax - Order Fresh Street Food & Meals in Vasai-Virar" />
    <meta name="twitter:description" content="Order fresh street food, live queue tokens, and meals from local food stalls in Vasai-Virar." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Branded Pre-Hydration Placeholder (replaced instantly when React mounts) -->
      <div id="app-loading-fallback" style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F8F9FA; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; padding: 24px;">
        <div style="width: 48px; height: 48px; border: 4px solid #FED7AA; border-top-color: #EA580C; border-radius: 50%; animation: ff-spin 0.75s linear infinite;"></div>
        <p style="margin-top: 18px; font-size: 14px; font-weight: 700; color: #475569; letter-spacing: -0.01em;">Loading FoodFax...</p>
        <style>@keyframes ff-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      // Global Emergency Catcher: prevent mystery blank screens on slow or failing asset loads
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('app-loading-fallback');
        if (loader) {
          loader.innerHTML = '<div style="max-width: 440px; background: white; border: 1px solid #FECDD3; border-radius: 20px; padding: 28px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.08);">' +
            '<div style="font-size: 36px; margin-bottom: 12px;">⚠️</div>' +
            '<h3 style="font-size: 17px; font-weight: 800; color: #9F1239; margin: 0 0 8px 0;">FoodFax Loading Error</h3>' +
            '<p style="font-size: 12px; color: #64748B; line-height: 1.5; margin: 0 0 18px 0; word-break: break-word;">' + (e.message || 'Failed to initialize application scripts.') + '</p>' +
            '<button onclick="window.location.reload()" style="background: #EA580C; color: white; border: none; padding: 10px 22px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(234,88,12,0.3);">Reload App</button>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
